<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    >
    <meta name="referrer" content="no-referrer">
    <title>Classic Solitaire</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Classic Solitaire</p>
          <h1>Solitario</h1>
        </div>
        <div class="status" aria-live="polite">
          <span id="moves">0 movimientos</span>
          <span id="timer">00:00</span>
        </div>
        <button id="undo" class="new-game" type="button" tabindex="-1" disabled>Deshacer</button>
        <button id="new-game" class="new-game" type="button" tabindex="-1">Nueva partida</button>
      </header>

      <section class="board" aria-label="Mesa de solitario">
        <div class="upper-row">
          <div class="draw-area" aria-label="Mazo y descarte">
            <button id="stock" class="pile stock" type="button" tabindex="-1" aria-label="Robar carta">
              <span id="stock-count" class="stock-count">24</span>
            </button>
            <div id="waste" class="pile waste" aria-label="Descarte"></div>
          </div>

          <div id="foundations" class="foundations" aria-label="Fundaciones"></div>
        </div>

        <div id="tableau" class="tableau" aria-label="Columnas"></div>
      </section>

      <section class="help-panel">
        <h2>Como jugar</h2>
        <p>Roba del mazo, alterna colores en las columnas y sube cada palo a su fundacion desde el as hasta el rey.</p>
        <p>Toca una carta para moverla automaticamente si hay un destino valido, o arrastra cartas y secuencias.</p>
        <label class="leave-warning">
          <input id="skip-leave-warning" type="checkbox">
          No volver a preguntar al salir o recargar
        </label>
      </section>

      <dialog id="win-dialog" class="win-dialog">
        <h2>Partida completada</h2>
        <p id="win-summary"></p>
        <button id="play-again" class="new-game" type="button">Jugar otra vez</button>
      </dialog>
    </main>

    <script src="./game.js" defer></script>
  </body>
</html>
